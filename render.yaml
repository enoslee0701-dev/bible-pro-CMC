# Render.com Blueprint — one-click deploy of the AI interpreter.
# In Render: New + > Blueprint > pick this repo. Render reads this file and
# deploys. No API key required — it runs in FREE mode (keyless machine
# translation) out of the box.
#
# To upgrade to full AI mode (Claude translation + AI auto-fix), add an
# ANTHROPIC_API_KEY environment variable in the Render dashboard after deploy.
services:
  - type: web
    name: ai-interpreter
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/languages
    envVars:
      # OPTIONAL — leave unset for free mode. Set it to enable Claude + AI
      # auto-fix. (Kept secret; not stored in the repo.)
      - key: ANTHROPIC_API_KEY
        sync: false
      # Only used when ANTHROPIC_API_KEY is set. claude-haiku-4-5 = lowest
      # latency; claude-sonnet-4-6 / claude-opus-4-8 = higher quality.
      - key: MODEL
        value: claude-haiku-4-5
      # OPTIONAL — a contact email raises the free translation provider's
      # anonymous daily quota. Leave unset if you don't need it.
      - key: MYMEMORY_EMAIL
        sync: false
